name: Update Finances

on:
  schedule:
    # Weekly, Mondays 14:00 UTC (after US market data settles for the prior week)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Manual trigger from the GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the comparison page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 finances/build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finances/index.html finances/data.json finances/history.json
          git diff --staged --quiet || git commit -m "Update finances $(date -u +%Y-%m-%dT%H:%M)"
          git push
